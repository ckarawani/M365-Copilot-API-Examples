info:
  name: 1 - Search Event by Subject and grab Join URL
  type: http
  seq: 1

http:
  method: GET
  url: https://graph.microsoft.com/v1.0/users/ckarawani@easy365.io/events?$filter=contains(subject,'Blog')
  params:
    - name: $filter
      value: contains(subject,'Blog')
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
