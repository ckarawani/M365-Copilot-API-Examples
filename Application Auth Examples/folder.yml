info:
  name: Application Auth Examples
  type: folder
  seq: 1

request:
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://login.microsoftonline.com/{{tenantId}}/oauth2/v2.0/token
    credentials:
      clientId: "{{appId}}"
      clientSecret: "{{secret}}"
      placement: body
    scope: https://graph.microsoft.com/.default
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
    settings:
      autoFetchToken: true
      autoRefreshToken: false
